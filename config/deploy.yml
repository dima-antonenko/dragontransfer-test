# Name of your application. Used to uniquely configure containers.
service: dragontransfer

# Имя образа на Docker Hub.
image: antonenkodima12/dragontransfer

# Deploy to these servers.
servers:
  web:
    - 129.101.118.100

proxy:
  ssl: true
  host: medsistaging.ru
  app_port: 80
  healthcheck:
    path: /up
    interval: 10
    timeout: 5

# Сколько ждать, пока новый контейнер начнёт отвечать на /up.
# На первом старте db:prepare может занять больше дефолтных 30 секунд.
deploy_timeout: 120

# Credentials for your image host.
registry:
  server: docker.io
  username: antonenkodima12
  password:
    - KAMAL_REGISTRY_PASSWORD

# Собираем образ локально, затем пушим на Docker Hub.
# context: . — берём текущие файлы, а не git clone (в репозитории пока нет коммитов).
builder:
  arch: amd64
  driver: docker
  context: .

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true
    FORCE_SSL: "true"
    APP_HOST: https://medsistaging.ru
    DRAGONTRANSFER_BASE_URL: https://test.dragontransfer.online
    WEB_CONCURRENCY: "1"
    RAILS_MAX_THREADS: "3"
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - DRAGONTRANSFER_API_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

# Постоянный том для Active Storage.
volumes:
  - storage:/rails/storage

# PostgreSQL рядом с приложением (как accessory в других Kamal-проектах).
accessories:
  db:
    image: postgres:16-alpine
    host: 129.101.118.100
    cmd: postgres -c shared_buffers=128MB -c max_connections=50
    options:
      memory: 384m
    env:
      clear:
        POSTGRES_USER: dragontransfer
        POSTGRES_DB: dragontransfer_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
