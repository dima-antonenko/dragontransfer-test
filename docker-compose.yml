services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dragontransfer
      POSTGRES_PASSWORD: dragontransfer
      POSTGRES_DB: dragontransfer_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragontransfer -d dragontransfer_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dragontransfer:dragontransfer@db:5432/dragontransfer_development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle:/usr/local/bundle

volumes:
  postgres_data:
  bundle:
